services:
  postgres:
    image: postgres:16-alpine
    container_name: p2p-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: p2p_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: p2p-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    container_name: p2p-engine
    restart: unless-stopped
    env_file:
      - ../config/.env
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: p2p-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - ../config/.env
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
