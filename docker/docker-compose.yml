services:
  postgres:
    image: postgres:16-alpine
    container_name: p2p-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-p2p_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-p2p_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - p2p_internal

  redis:
    image: redis:7-alpine
    container_name: p2p-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - p2p_internal

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: p2p-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4096m
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    expose:
      - "8000"
    volumes:
      - botdata:/app/data
    env_file:
      - ../config/.env
    environment:
      DISABLE_MARKET_COLLECTOR: "0"
      OMP_THREAD_LIMIT: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - p2p_internal

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    container_name: p2p-engine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - botdata:/app/data
    env_file:
      - ../config/.env
    environment:
      DISABLE_EMBEDDED_API: "1"
      PORT: "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - p2p_internal

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    container_name: p2p-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 96
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - p2p_internal

  caddy:
    image: caddy:2-alpine
    container_name: p2p-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 64
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api
    networks:
      - p2p_internal

  dashboard:
    profiles: ["legacy"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: p2p-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - botdata:/app/data
    env_file:
      - ../config/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - p2p_internal

volumes:
  pgdata:
  redisdata:
  botdata:
  caddy_data:
  caddy_config:

networks:
  p2p_internal:
    driver: bridge
