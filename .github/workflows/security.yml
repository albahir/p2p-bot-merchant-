name: Security & SAST Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Cada lunes a las 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Detection (Fail-Closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        with:
          args: --config=.gitleaks.toml --redact --report-format=sarif --report-path=gitleaks.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

  codeql:
    name: CodeQL Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  dependency-audit:
    name: Pip-Audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit

      - name: Audit Dependencies (Fail on HIGH/CRITICAL)
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit.json || {
            echo "Evaluando severidad de vulnerabilidades detectadas..."
            python -c "
import json, sys
try:
    data = json.load(open('pip-audit.json'))
    vulns = [v for pkg in data.get('dependencies', []) for v in pkg.get('vulns', [])]
    crit = [v for v in vulns if any(fix in v.get('aliases', []) for fix in ['GHSA', 'CVE'])]
    if crit:
        print(f'Vulnerabilidades criticas encontradas: {len(crit)}')
        sys.exit(1)
except Exception as e:
    print(f'Error procesando pip-audit: {e}')
    sys.exit(1)
"
          }

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit.json
